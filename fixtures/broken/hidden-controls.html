<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broken: hidden and obstructed controls</title>
<link rel="stylesheet" href="../base.css">
<style>
  .checkout { position: relative; margin: 16px; padding: 16px; border: 1px solid #d0d7de; max-width: 520px; }
  /* DEFECT: invisible overlay left over the form intercepts every click. */
  .shield { position: absolute; inset: 0; background: transparent; z-index: 5; }

  .help-wrap { position: relative; margin: 16px; padding: 16px; border: 1px dashed #8c959f; }
  /* DEFECT: control positioned left of the document origin, unreachable by scrolling. */
  #btn-help { position: absolute; left: -180px; top: 8px; }

  .promo-area { position: relative; margin: 16px; height: 120px; border: 1px solid #d0d7de; }
  #btn-chat { position: absolute; left: 16px; top: 16px; z-index: 1; }
  /* DEFECT: opaque panel stacked above the chat button. */
  #promo-panel { position: absolute; left: 0; top: 0; width: 220px; height: 100px; background: #fff3c4; z-index: 2; padding: 8px; box-sizing: border-box; }
</style>
</head>
<body>
  <h1>Checkout</h1>
  <section class="checkout" id="checkout" data-defect="click-shield">
    <h2>Review your order</h2>
    <p>Two items, delivered Thursday.</p>
    <button id="btn-pay">Pay now</button>
    <button id="btn-cancel">Cancel</button>
    <div class="shield" id="click-shield"></div>
  </section>

  <section class="help-wrap" id="help-wrap" data-defect="offscreen-control">
    <p>Need help? Our team is available around the clock.</p>
    <button id="btn-help">Contact support</button>
  </section>

  <section class="promo-area" id="promo-area" data-defect="covered-control">
    <button id="btn-chat">Open chat</button>
    <div id="promo-panel">Limited offer: 20% off annual plans this week.</div>
  </section>
</body>
</html>
